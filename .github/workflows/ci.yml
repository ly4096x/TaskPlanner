name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ly4096x/taskplanner
  # Opt JS actions (checkout, setup-uv, etc.) into Node 24 ahead of the
  # 2026-06-16 default switch. Silences the Node 20 deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"
      - run: mkdir -p client_web/dist/assets && touch client_web/dist/index.html
      - run: uv run pytest -x -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"
      - run: mkdir -p client_web/dist/assets && touch client_web/dist/index.html
      - run: uv run ruff check .

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client_web/pnpm-lock.yaml
      - run: cd client_web && pnpm install --frozen-lockfile && pnpm build

  # --- Release jobs ---
  # Trigger on tag push (manual release) OR push to main (auto-release if
  # pyproject version has no matching GitHub release yet).

  release-cli:
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
              exit 1
            fi
          fi
          if gh release view "v$PYPROJECT_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$PYPROJECT_VERSION already exists, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$PYPROJECT_VERSION" >> "$GITHUB_OUTPUT"
      - if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.ver.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
      - if: steps.ver.outputs.skip != 'true'
        name: Build CLI binary
        run: |
          mkdir -p client_web/dist/assets && touch client_web/dist/index.html
          uv run python build/build_cli.py
      - if: steps.ver.outputs.skip != 'true'
        name: Test CLI binary
        run: dist/TaskPlanner --help
      - if: steps.ver.outputs.skip != 'true'
        name: Create or update release (tags current commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            dist/TaskPlanner \
          || gh release upload "v$VERSION" dist/TaskPlanner --clobber

  release-image:
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test, lint, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
              exit 1
            fi
          fi
          if gh release view "v$PYPROJECT_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$PYPROJECT_VERSION already exists, skipping image build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$PYPROJECT_VERSION" >> "$GITHUB_OUTPUT"
      - if: steps.ver.outputs.skip != 'true'
        name: Build container image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          podman build -t "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
                       -t "${REGISTRY}/${IMAGE_NAME}:latest" \
                       -f build/Containerfile .
      - if: steps.ver.outputs.skip != 'true'
        name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | podman login "${REGISTRY}" -u "$GH_ACTOR" --password-stdin
      - if: steps.ver.outputs.skip != 'true'
        name: Push container image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          podman push "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          podman push "${REGISTRY}/${IMAGE_NAME}:latest"
