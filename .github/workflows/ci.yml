name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ly4096x/taskplanner

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: mkdir -p client_web/dist/assets && touch client_web/dist/index.html
      - run: uv run pytest -x -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: mkdir -p client_web/dist/assets && touch client_web/dist/index.html
      - run: uv run ruff check .

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client_web/pnpm-lock.yaml
      - run: cd client_web && pnpm install --frozen-lockfile && pnpm build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verify tag matches pyproject.toml version
      - name: Verify version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> $GITHUB_ENV

      # Build CLI binary with Nuitka
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install Nuitka and deps
        run: |
          mkdir -p client_web/dist && touch client_web/dist/index.html
          uv pip install --system nuitka click httpx pyyaml ordered-set
      - name: Build CLI binary
        run: |
          python3 -m nuitka \
            --standalone --onefile \
            --output-dir=dist --output-filename=TaskPlanner \
            --include-package=client_cli \
            --include-package=server.schema \
            --include-package=shared \
            --include-package-data=shared \
            --nofollow-import-to=server.app \
            --nofollow-import-to=server.crud \
            --nofollow-import-to=server.db \
            --nofollow-import-to=server.events \
            --nofollow-import-to=server.models \
            --nofollow-import-to=server.query_lang \
            --nofollow-import-to=server.__main__ \
            --nofollow-import-to=fastapi \
            --nofollow-import-to=uvicorn \
            --nofollow-import-to=pydantic \
            --nofollow-import-to=starlette \
            --nofollow-import-to=sqlite3 \
            --python-flag=-O \
            client_cli/cli.py
      - name: Test CLI binary
        run: dist/TaskPlanner --help

      # Build container image
      - name: Build container image
        run: |
          podman build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
                       -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                       -f Containerfile .

      # Push container image to GHCR
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Push container image
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # Create GitHub release with CLI binary
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.VERSION }}" \
            --title "v${{ env.VERSION }}" \
            --generate-notes \
            dist/TaskPlanner \
          || gh release upload "v${{ env.VERSION }}" dist/TaskPlanner --clobber
