[project]
name = "task-planner"
version = "0.3.12"
description = "Task planning system with FastAPI backend and CLI frontend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.scripts]
TaskPlanner = "client_cli.cli:main"
TaskPlannerServer = "server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "client_cli", "shared"]

[tool.hatch.build.targets.wheel.force-include]
"client_web/dist" = "server/static"

[tool.uv]
# Supply-chain policy: only consider package versions published at least one
# week ago, so a freshly-published (possibly compromised) release can't be
# pulled in. Rolling window — evaluated at each resolution. Mirrors pnpm's
# minimumReleaseAge in client_web/pnpm-workspace.yaml.
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.11.0",
    "nuitka>=2.7",
    "ordered-set>=4.1",
]
